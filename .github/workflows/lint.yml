name: Lint

on:
  push:
    branches:
      - main
  # Removed pull_request trigger — now handled by pr-gate.yml

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            docs/**/*.md
            README.md
            AGENTS.md
            CONTRIBUTING.md

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install dev deps
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check scripts/ tests/
      - name: Format check
        run: ruff format --check scripts/ tests/
      - name: Audit Python dependencies
        run: pip-audit --skip-editable

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-fail-under=90

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --retry-wait-time 5 --max-retries 3 --timeout 30
            docs/**/*.md README.md CONTRIBUTING.md AGENTS.md
          fail: true

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install docs deps
        run: pip install -r requirements-docs.txt
      - name: Build MkDocs site (strict)
        run: mkdocs build --strict

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  mermaid-check:
    runs-on: ubuntu-latest
    needs:
      - markdownlint
      - docs-build
      - python-lint
      - python-test
      - link-check
      - npm-audit
    env:
      PUPPETEER_CONFIG_FILE: /tmp/puppeteer-config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install mermaid-cli
        run: npm ci
      - name: Expose local bin on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH
      - name: Write puppeteer config
        run: echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json
      - name: Validate Mermaid diagrams
        run: |
          python3 scripts/validate_mermaid.py \
            $(find docs -name '*.md' \
              ! -path 'docs/azure/diagrams/*' \
              ! -path 'docs/overrides/*' | sort) \
            $(find docs -name '*.mmd' | sort)
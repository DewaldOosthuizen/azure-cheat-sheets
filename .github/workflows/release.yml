name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (CalVer YYYY.MM.DD[.micro]). If omitted, computes next version from current date."
        required: false
        type: string
      skip_deploy:
        description: "Skip Vercel production deploy"
        required: false
        type: boolean
        default: false
      skip_changelog:
        description: "Skip changelog generation (use last tag as baseline)"
        required: false
        type: boolean
        default: false

# Required permissions for: tagging, creating releases, committing version bump
permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # 1. Prepare release: compute version, update pyproject.toml, commit, tag, push
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
    steps:
      - name: Checkout (full history for tag detection)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          VERSION_ARG="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_ARG" ]; then
            NEW_VERSION=$(python3 scripts/bump_version.py "$VERSION_ARG")
          else
            NEW_VERSION=$(python3 scripts/bump_version.py)
          fi
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          TAG="v$NEW_VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Get the commit SHA after version bump commit
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: steps.bump.outputs.version != ''
        run: |
          git add pyproject.toml
          git commit -m "chore: release ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Create and push tag
        if: steps.bump.outputs.version != ''
        run: |
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  # 2. Build release artifacts at the new tag
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python dev dependencies
        run: pip install -e '.[dev]'

      - name: Install Node dependencies
        run: npm ci

      - name: Run full CI pipeline (make ci)
        run: make ci

      - name: Build MkDocs site (strict)
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02  # v4.6.2
        with:
          name: site
          path: site/
          retention-days: 7

  # 3. Generate changelog and create GitHub Release
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release]
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate changelog
        id: changelog
        if: ${{ !github.event.inputs.skip_changelog }}
        run: |
          python3 scripts/generate_changelog.py --output CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@1123a1b7b5c841fa124c6465b4110ecb6a48b129  # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false

  # 4. Deploy to Vercel production
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release, create-github-release]
    if: ${{ !github.event.inputs.skip_deploy }}
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Vercel CLI (pinned)
        run: npm install --global vercel@59.10.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Post deployment comment
        run: |
          echo "🚀 Deployed version ${{ needs.prepare-release.outputs.version }} to production"
          echo "🔗 https://tech-cheat-sheets-and-notes.vercel.app"
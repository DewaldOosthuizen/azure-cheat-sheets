# ──────────────────────────────────────────────────────────────────────────────
# Release Pipeline — Tech Cheat Sheets
#
# Single chained workflow: markdownlint → python-lint → mermaid-check →
# python-test → build → version/tag/release → Vercel deploy.
# Every job depends on the previous one succeeding.
#
# Triggers
# --------
#   push to main       — full pipeline, auto-version if HEAD differs from last tag
#   workflow_dispatch  — full pipeline, manual trigger (e.g. from Actions tab)
#
# Version/tag/release skip rule
# ------------------------------
#   If HEAD's SHA equals the commit SHA of the last CalVer tag on origin/main,
#   the bump/tag/release step is skipped and Vercel deploy proceeds with the
#   current state. If no CalVer tag exists yet, or HEAD has moved past the
#   last tag, the step runs: bump_version.py computes CalVer, updates
#   pyproject.toml, commits, pushes tag, and optionally creates a GitHub Release.
#
# Vercel deploy
# -------------
#   Runs after the version step (whether it executed or was skipped). Deploys
#   the tag reference when a tag was created; otherwise deploys HEAD.
#   No environment gate — deploys straight to production.
# ──────────────────────────────────────────────────────────────────────────────

name: Release Pipeline

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (CalVer YYYY.MM.DD[.micro]). Omit to auto-compute."
        required: false
        type: string
      skip_deploy:
        description: "Skip Vercel production deploy"
        required: false
        type: boolean
        default: false
      skip_changelog:
        description: "Skip changelog generation (use last tag as baseline)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── 1. Markdown Lint ────────────────────────────────────────────────────────
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: |
          npx markdownlint-cli2 \
            "docs/**/*.md" \
            "README.md" \
            "AGENTS.md" \
            "CONTRIBUTING.md" \
            --config .markdownlint-cli2.yaml

  # ── 2. Python Lint ─────────────────────────────────────────────────────────
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: markdownlint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      - name: Ruff check
        run: ruff check scripts/ tests/

      - name: Ruff format check
        run: ruff format --check scripts/ tests/

  # ── 3. Mermaid Check ───────────────────────────────────────────────────────
  mermaid-check:
    name: Mermaid Check
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Expose local bin on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH

      - name: Run mermaid validation
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json
          find docs -name '*.md' ! -path 'docs/azure/diagrams/*' ! -path 'docs/overrides/*' > /tmp/md-files.txt
          find docs -name '*.mmd' > /tmp/mmd-files.txt
          PUPPETEER_CONFIG_FILE=/tmp/puppeteer-config.json python scripts/validate_mermaid.py $(cat /tmp/md-files.txt) $(cat /tmp/mmd-files.txt)

  # ── 4. Python Tests ────────────────────────────────────────────────────────
  python-test:
    name: Python Tests (3.11)
    runs-on: ubuntu-latest
    needs: mermaid-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-fail-under=90

  # ── 5. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: python-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site (strict)
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02  # v4.6.2
        with:
          name: site
          path: site/
          retention-days: 7

  # ── 6. Version · Tag · Release ─────────────────────────────────────────────
  version-tag-release:
    name: Version · Tag · Release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.skip-check.outputs.skip }}
      backend_version: ${{ steps.tag.outputs.backend_version }}
      frontend_version: ${{ steps.tag.outputs.frontend_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 6a. Skip check: is HEAD already released? ──────────────────────────
      - name: Check if HEAD already matches last release tag
        id: skip-check
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          LAST_TAG=""
          if LAST_TAG=$(git tag -l --sort=-version:refname | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' | head -n 1); then
            : # tag found
          fi

          if [ -z "$LAST_TAG" ]; then
            echo "No existing CalVer tag found — will create one"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_SHA=$(git rev-parse "$LAST_TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)

          echo "Last release tag: $LAST_TAG (commit: $TAG_SHA)"
          echo "HEAD commit:      $HEAD_SHA"

          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "HEAD matches last release tag — skipping version/tag/release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD differs from last release tag — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 6b. Compute CalVer tag ─────────────────────────────────────────────
      - name: Compute CalVer tag
        id: version
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail

          BASE_YEAR=$(date -u +%Y)
          BASE_MONTH=$(date -u +%m)
          BASE_DAY=$(date -u +%d)
          BASE="${BASE_YEAR}.${BASE_MONTH}.${BASE_DAY}"

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          VERSION_ARG="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_ARG" ]; then
            TAG="$VERSION_ARG"
          else
            CANDIDATES=$(git ls-remote --tags origin | grep -E "refs/tags/${BASE}(\.[0-9]+)?$" || true)

            if [ -z "$CANDIDATES" ]; then
              TAG="$BASE"
            else
              MAX=0
              while IFS= read -r line; do
                t=$(echo "$line" | sed 's|^.*refs/tags/||')
                if [[ "$t" == "$BASE" ]]; then
                  : # bare base seen, patches may exist
                else
                  m=${t#${BASE}.}
                  if [[ "$m" =~ ^[0-9]+$ ]] && [ "$m" -gt "$MAX" ]; then
                    MAX=$m
                  fi
                fi
              done <<< "$CANDIDATES"
              TAG="${BASE}.$((MAX + 1))"
            fi
          fi

          if [[ ! "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::Computed tag '$TAG' does not match CalVer (YYYY.MM.DD or YYYY.MM.DD.Micro)"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          MICRO="${TAG#${BASE}.}"
          [ "$MICRO" = "$TAG" ] && MICRO=""
          [ -n "$MICRO" ] && echo "micro=${MICRO}" >> "$GITHUB_OUTPUT"
          echo "Computed version: $TAG (base=$BASE, micro=${MICRO:-none})"

      - name: Verify tag does not already exist
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag '${{ steps.version.outputs.tag }}' already exists on origin — aborting"
            exit 1
          fi
          echo "Tag '${{ steps.version.outputs.tag }}' does not exist yet"

      - name: Warn if HEAD is not yet on origin/main
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          git fetch origin main
          if ! git diff --quiet origin/main...HEAD; then
            echo "::warning::HEAD has commits not yet merged to origin/main — tagging anyway"
          fi

      # ── 6c. Bump version, tag, push ────────────────────────────────────────
      - name: Bump versions, create tag, push
        id: tag
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          python3 scripts/bump_version.py "$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git commit -m "chore: release $TAG"
          echo "Committed version bump to $TAG"

          git push origin main
          echo "Pushed version bump commit to main"

          git tag -a "$TAG" -m "Release $TAG (CalVer rolling release)"
          git push origin "$TAG"
          echo "Tagged and pushed $TAG"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${TAG}" >> "$GITHUB_OUTPUT"

      # ── 6d. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          python3 scripts/generate_changelog.py --output CHANGELOG.md

          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file CHANGELOG.md \
            --target main

          echo "Created GitHub Release $TAG"

      # ── 6e. Summaries ──────────────────────────────────────────────────────
      - name: Summary (skipped)
        if: steps.skip-check.outputs.skip == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Version · Tag · Release — skipped

          - HEAD commit already matches the last release tag.
          - No version bump, tag, or GitHub Release created.
          - Vercel deploy will proceed with the current state.
          EOF

      - name: Summary (tag)
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE="${{ steps.version.outputs.base }}"
          MICRO="${{ steps.version.outputs.micro }}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Version · Tag · Release

          - **Version:** \`${TAG}\`
          - **Base (YYYY.MM.DD):** \`${BASE}\`
          - **Micro:** ${MICRO:-none}
          - **GitHub Release:** \`${TAG}\`
          EOF

  # ── 7. Deploy to Vercel ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: version-tag-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version-tag-release.outputs.tag != '' && needs.version-tag-release.outputs.tag || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI (pinned)
        run: npm install --global vercel@59.10.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        # Uses `vercel.json` buildCommand:
        #   python -m pip install -r requirements-docs.txt && mkdocs build --strict
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        # --prebuilt tells Vercel to trust the local build output instead of
        # rebuilding remotely, keeping deploy deterministic.
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Summary (deploy)
        run: |
          TAG_OR_SHA="${{ needs.version-tag-release.outputs.tag != '' && needs.version-tag-release.outputs.tag || github.sha }}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployed to Vercel Production

          - **Deployed:** \`${TAG_OR_SHA}\`
          - **Frontend URL:** https://tech-cheat-sheets-and-notes.vercel.app
          EOF

name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Quick markdown lint — fast feedback on content formatting
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            docs/**/*.md
            README.md
            AGENTS.md
            CONTRIBUTING.md
          config_file: .markdownlint-cli2.yaml

  # Quick Python lint — ruff check + format check (no audit, no test matrix)
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: [markdownlint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check scripts/ tests/
      - name: Ruff format check
        run: ruff format --check scripts/ tests/

  # Quick Node mermaid validation — depends on python-lint
  mermaid-check:
    name: Mermaid Check
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Expose local bin on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH
      - name: Run mermaid validation
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json
          find docs -name '*.md' ! -path 'docs/azure/diagrams/*' ! -path 'docs/overrides/*' > /tmp/md-files.txt
          find docs -name '*.mmd' > /tmp/mmd-files.txt
          PUPPETEER_CONFIG_FILE=/tmp/puppeteer-config.json python scripts/validate_mermaid.py $(cat /tmp/md-files.txt) $(cat /tmp/mmd-files.txt)

  # Quick Python tests — single version, with coverage gate
  python-test:
    name: Python Tests (3.11)
    runs-on: ubuntu-latest
    needs: [mermaid-check]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-fail-under=90

  # Quick Node audit — high severity only
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies (high+)
        run: npm audit --audit-level=high

  # Summary job — ensures all required checks pass before merge
  pr-gate-summary:
    name: PR Gate Summary
    runs-on: ubuntu-latest
    needs: [markdownlint, python-lint, mermaid-check, python-test, npm-audit]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.markdownlint.result }}" != "success" ]]; then
            echo "❌ markdownlint failed"
            exit 1
          fi
          if [[ "${{ needs.python-lint.result }}" != "success" ]]; then
            echo "❌ python-lint failed"
            exit 1
          fi
          if [[ "${{ needs.python-test.result }}" != "success" ]]; then
            echo "❌ python-test failed"
            exit 1
          fi
          if [[ "${{ needs.npm-audit.result }}" != "success" ]]; then
            echo "❌ npm-audit failed"
            exit 1
          fi
          if [[ "${{ needs.mermaid-check.result }}" != "success" ]]; then
            echo "❌ mermaid-check failed"
            exit 1
          fi
          echo "✅ All PR gate checks passed"
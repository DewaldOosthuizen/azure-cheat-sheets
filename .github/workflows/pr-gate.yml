# PR Gate
# 
# Fast, lightweight CI gate that runs on every pull request and
# pull_request_target event.
#
# Design goals:
# - Fast feedback: lightweight checks before a reviewer even looks.
# - Sequential failure isolation: each stage depends on the previous one,
#   so a markdown failure stops the pipeline before wasting time on tests.
# - Exact local/CI parity: mirrors `make markdownlint`, `make python-lint`,
#   `make mermaid-check`, and `make python-test` behavior so contributors
#   can reproduce any failure locally with the same commands.
# - Config consistency: `markdownlint` passes `.markdownlint-cli2.yaml`
#   explicitly so CI doesn't fall back to the action's bundled defaults.
#
# Trigger events:
# - pull_request (opened/synchronize/reopened/ready_for_review)
#   Runs against the PR head. Safe for fork PRs as long as no secret
#   is read in these steps.
# - pull_request_target
#   Runs in the base repo context and can read secrets. We include it
#   because some future check may need secret access; it won't execute
#   the heavy steps again since the same checks already ran on the
#   pull_request event for same commits.
#
# Concurrency:
# - Cancel in-progress runs for the same PR when new commits are pushed,
#   preventing stale runs from cluttering the Actions tab.
#
# Job dependency order:
# 1. markdownlint
# 2. python-lint (needs: markdownlint)
# 3. mermaid-check (needs: python-lint)
# 4. python-test (needs: mermaid-check)
# 5. npm-audit (independent; runs in parallel with the chain)
# 6. pr-gate-summary (needs: all above; if: always() to report status)

name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # 1. Markdown content formatting
  # Runs first; failure blocks the rest of the chain.
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            docs/**/*.md
            README.md
            AGENTS.md
            CONTRIBUTING.md
          # Explicitly pass the project's relaxed config so CI matches local
          # `make markdownlint` behavior. Without this, the action falls back
          # to bundled defaults that differ from the repo's `.markdownlint-cli2.yaml`.
          config_file: .markdownlint-cli2.yaml

  # 2. Python linting (ruff check + format check)
  # Depends on markdownlint; skips if formatting is already broken.
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: [markdownlint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Ruff check
        # Runs `ruff check scripts/ tests/`; fails on lint errors.
        run: ruff check scripts/ tests/
      - name: Ruff format check
        # Runs `ruff format --check scripts/ tests/`; fails on formatting drift.
        run: ruff format --check scripts/ tests/

  # 3. Mermaid diagram validation
  # Depends on python-lint; validates both embedded diagrams in cheat sheets
  # and standalone `.mmd` files.
  #
  # Why this is in the PR gate:
  # - Diagram syntax errors break the docs build and confuse readers.
  # - Validating here catches broken Mermaid before merge, when fixes are cheap.
  #
  # Why mmdc must be on PATH:
  # - `npm ci` installs `@mermaid-js/mermaid-cli` into `node_modules/.bin/`,
  #   not globally. GitHub runners don't add this dir to PATH automatically.
  # - We explicitly append it so `scripts/validate_mermaid.py` can find `mmdc`.
  mermaid-check:
    name: Mermaid Check
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Expose local bin on PATH
        # npm ci installs mmdc into node_modules/.bin; add it so validate_mermaid.py can call it.
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH
      - name: Run mermaid validation
        run: |
          # Puppeteer flags avoid Chromium sandbox issues on GitHub runners.
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json
          # Collect markdown files excluding diagram-only dirs and theme overrides.
          find docs -name '*.md' ! -path 'docs/azure/diagrams/*' ! -path 'docs/overrides/*' > /tmp/md-files.txt
          # Collect standalone .mmd diagram files.
          find docs -name '*.mmd' > /tmp/mmd-files.txt
          # Pass both lists to the validator. PUPPETEER_CONFIG_FILE is respected
          # by validate_mermaid.py and forwarded to mmdc.
          PUPPETEER_CONFIG_FILE=/tmp/puppeteer-config.json python scripts/validate_mermaid.py $(cat /tmp/md-files.txt) $(cat /tmp/mmd-files.txt)

  # 4. Python tests with coverage gate
  # Depends on mermaid-check; runs a single Python version (3.11) for speed.
  # The full matrix (3.11/3.12/3.13) lives in lint.yml push-to-main CI.
  python-test:
    name: Python Tests (3.11)
    runs-on: ubuntu-latest
    needs: [mermaid-check]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Run tests with coverage
        # --cov=scripts measures only the scripts/ package; --cov-fail-under=90
        # enforces the repo's 90% minimum for new or changed code paths.
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-fail-under=90

  # 5. npm security audit
  # Independent; runs in parallel because it doesn't depend on Python steps.
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies (high+)
        # We surface high and critical advisories; low/medium are tracked
        # in dependabot weekly updates to avoid noise.
        run: npm audit --audit-level=high

  # Summary job — ensures all required checks pass before merge
  # if: always() guarantees this runs even if a previous job failed, so
  # the PR shows a clear "PR Gate Summary" failure instead of a gray skip.
  pr-gate-summary:
    name: PR Gate Summary
    runs-on: ubuntu-latest
    needs: [markdownlint, python-lint, mermaid-check, python-test, npm-audit]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.markdownlint.result }}" != "success" ]]; then
            echo "❌ markdownlint failed"
            exit 1
          fi
          if [[ "${{ needs.python-lint.result }}" != "success" ]]; then
            echo "❌ python-lint failed"
            exit 1
          fi
          if [[ "${{ needs.python-test.result }}" != "success" ]]; then
            echo "❌ python-test failed"
            exit 1
          fi
          if [[ "${{ needs.npm-audit.result }}" != "success" ]]; then
            echo "❌ npm-audit failed"
            exit 1
          fi
          if [[ "${{ needs.mermaid-check.result }}" != "success" ]]; then
            echo "❌ mermaid-check failed"
            exit 1
          fi
          echo "✅ All PR gate checks passed"
